<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Test Project</title>
  
  <!-- CSS STYLES -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 350px;
    }

    h1 {
      color: #333;
    }

    p {
      color: #666;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- HTML STRUCTURE -->
  <div class="card">
    <h1>Hello, Git!</h1>
    <p id="status-text">Click the button below to test JavaScript.</p>
    <button id="test-btn">Click Me!</button>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const button = document.getElementById('test-btn');
    const statusText = document.getElementById('status-text');

    button.addEventListener('click', () => {
      statusText.textContent = '🎉 It works! JavaScript and CSS are working!';
      statusText.style.color = '#28a745';
      statusText.style.fontWeight = 'bold';
    });
  </script>

</body>
</html>
